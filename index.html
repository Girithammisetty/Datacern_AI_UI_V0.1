<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_84 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_84" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_84');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.device_pixel_ratio || 1);
container.appendChild(renderer.domElement);

// Create the pipeline nodes
const createNode = (x, color, label) => {
    const geometry = new THREE.IcosahedronGeometry(0.4, 1);
    const material = new THREE.MeshPhongMaterial({ 
        color: color, 
        emissive: color, 
        emissiveIntensity: 0.5,
        transparent: true,
        opacity: 0.8
    });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.x = x;
    scene.add(mesh);
    return mesh;
};

// Colors from Lumina Nexus (Cyan: #22d3ee)
const accentColor = new THREE.Color(0x22d3ee);
const ingestionNode = createNode(-3, accentColor, 'Ingestion');
const modelNode = createNode(0, accentColor, 'Agentic AI');
const decisionNode = createNode(3, accentColor, 'Decision');

// Particles for flow
const particleCount = 100;
const particles = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
for(let i = 0; i < particleCount; i++) {
    positions[i*3] = -3 + Math.random() * 6;
    positions[i*3+1] = (Math.random() - 0.5) * 0.5;
    positions[i*3+2] = (Math.random() - 0.5) * 0.5;
}
particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const particleMaterial = new THREE.PointsMaterial({ color: 0x22d3ee, size: 0.05, transparent: true, opacity: 0.6 });
const points = new THREE.Points(particles, particleMaterial);
scene.add(points);

const light = new THREE.PointLight(0x22d3ee, 2, 10);
light.position.set(0, 2, 2);
scene.add(light);
scene.add(new THREE.AmbientLight(0x404040));

function animate() {
    requestAnimationFrame(animate);
    
    const time = Date.now() * 0.001;
    
    // Animate nodes
    ingestionNode.rotation.y += 0.01;
    modelNode.rotation.y += 0.02;
    decisionNode.rotation.y += 0.01;
    
    ingestionNode.position.y = Math.sin(time) * 0.2;
    modelNode.position.y = Math.cos(time * 1.2) * 0.2;
    decisionNode.position.y = Math.sin(time * 0.8) * 0.2;

    // Animate particles flow
    const pos = particles.attributes.position.array;
    for(let i = 0; i < particleCount; i++) {
        pos[i*3] += 0.02;
        if(pos[i*3] > 3.5) pos[i*3] = -3.5;
    }
    particles.attributes.position.needsUpdate = true;

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_84 -->


</body></html>
